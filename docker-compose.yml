services:
  postgres:
    image: postgres:16-alpine
    container_name: github-knowledge-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: github_knowledge_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - github-knowledge-network

  redis:
    image: redis:7-alpine
    container_name: github-knowledge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - github-knowledge-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: github-knowledge-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      disable: true
    networks:
      - github-knowledge-network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  github-knowledge-network:
    driver: bridge
